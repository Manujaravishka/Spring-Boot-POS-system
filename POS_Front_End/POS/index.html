<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>POS Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Mini POS</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="#">Dashboard</a>
            <a class="nav-link" href="pages/customer.html">Customer</a>
            <a class="nav-link" href="pages/item.html">Item</a>
            <a class="nav-link" href="pages/order.html">Order</a>
        </div>
    </div>
</nav>

<!-- CONTENT -->
<div class="container mt-4">

    <div class="mb-4">
        <h3>Dashboard</h3>
        <p class="text-muted">Welcome to Mini POS System</p>
    </div>

    <!-- CARDS -->
    <div class="row g-4">

        <!-- CUSTOMER -->
        <div class="col-md-4">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Customer Management</h5>
                    <p class="card-text text-muted">
                        Add, update and manage customers
                    </p>
                    <a href="pages/customer.html" class="btn btn-primary">
                        Go to Customers
                    </a>
                </div>
            </div>
        </div>

        <!-- ITEM -->
        <div class="col-md-4">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Item Management</h5>
                    <p class="card-text text-muted">
                        Manage items and stock
                    </p>
                    <a href="pages/item.html" class="btn btn-success">
                        Go to Items
                    </a>
                </div>
            </div>
        </div>

        <!-- ORDER -->
        <div class="col-md-4">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Place Orders</h5>
                    <p class="card-text text-muted">
                        Create new orders
                    </p>
                    <a href="pages/order.html" class="btn btn-warning">
                        Go to Orders
                    </a>
                </div>
            </div>
        </div>

    </div>

    <!-- FOOTER INFO -->
    <div class="mt-5 text-center text-muted">
        <small>
            Mini POS System · Version 1.0 <br>
            Cashier: Kamal
        </small>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
